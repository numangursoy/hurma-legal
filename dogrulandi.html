<!DOCTYPE html>
<!-- HURMA — E-POSTA DOGRULAMA INIS SAYFASI
     Supabase, dogrulama baglantisini once kendi /auth/v1/verify adresine
     goturur, sonra BURAYA dondurur.

     Neden dogrudan `hurma://` degil de bir web sayfasi?
     Kullanici maili MASAUSTUNDE acabilir. Tarayici `hurma://` semasini
     bilmez, sekme olu kalir — eskiden localhost:3000'e dusup takilmasinin
     sebebi de buydu. Bu sayfa her cihazda acilir, sonucu soyler ve
     telefondaysa uygulamayi acmayi dener.

     Jetonlar adres fragmentinde (#) gelir; fragment sunucuya GITMEZ ve
     bu sayfa onlari okumaz/saklamaz. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Hurma — E-posta doğrulandı</title>
<link rel="icon" href="hurma-maskot.png">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap");
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: #EFF6FE;
    font-family: "Fredoka", "Trebuchet MS", Verdana, sans-serif;
    color: #243142;
  }
  .kart {
    width: 100%; max-width: 460px;
    background: #fff; border-radius: 24px;
    padding: 40px 28px 32px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(31,126,242,.10);
  }
  .maskot { width: 96px; height: 96px; display: block; margin: 0 auto 6px; }
  .marka { font-size: 40px; font-weight: 600; color: #1F7EF2; letter-spacing: .5px; line-height: 1.1; }
  h1 { font-size: 24px; font-weight: 700; margin: 22px 0 0; line-height: 1.3; }
  p { font-size: 16px; color: #6B7A8F; line-height: 1.6; margin: 12px 0 0; }
  .rozet { font-size: 46px; line-height: 1; margin-top: 18px; }
  .buton {
    display: inline-block; margin-top: 26px;
    padding: 15px 34px; border-radius: 14px;
    background: #58CC02; border-bottom: 4px solid #46A302;
    color: #fff; font-size: 17px; font-weight: 700;
    text-decoration: none;
  }
  .buton.mavi { background: #2E90E8; border-bottom-color: #1C6FBE; }
  .alt { margin-top: 26px; font-size: 12.5px; color: #9AA8BC; line-height: 1.7; }
  .alt a { color: #9AA8BC; }
  @media (prefers-color-scheme: dark) {
    body { background: #16202E; color: #EAF1FA; }
    .kart { background: #1E2B3D; box-shadow: none; }
    p, .alt { color: #9AA8BC; }
  }
</style>
</head>
<body>
  <div class="kart">
    <img class="maskot" src="hurma-maskot.png" alt="">
    <div class="marka">hurma</div>

    <div class="rozet" id="rozet">✅</div>
    <h1 id="baslik">E-postan doğrulandı</h1>
    <p id="mesaj">Artık Hurma'ya giriş yapabilirsin. Uygulamaya dönüp e-posta ve şifrenle giriş yap.</p>

    <a class="buton" id="ac" href="hurma://">Hurma'yı aç</a>

    <div class="alt">
      Hurma — Kur'an-ı Kerim'i güzel oku, kalbine işle.<br>
      <a href="gizlilik">Gizlilik</a> &nbsp;·&nbsp; <a href="kosullar">Kullanım Koşulları</a>
    </div>
  </div>

<script>
  // Supabase hatayi da fragmentte bildirir (ornegin baglanti suresi dolmus).
  // Boyle bir durumda "dogrulandi" demek YANLIS olur; ekrani duruma gore yaz.
  (function () {
    var f = new URLSearchParams((location.hash || "").replace(/^#/, ""));
    var hata = f.get("error_description") || f.get("error");
    if (hata) {
      document.getElementById("rozet").textContent = "⏳";
      document.getElementById("baslik").textContent = "Bağlantının süresi dolmuş";
      document.getElementById("mesaj").textContent =
        "Bu doğrulama bağlantısı artık geçerli değil. Uygulamadan tekrar giriş yapmayı dene; " +
        "yeni bir doğrulama e-postası gönderilir.";
      var b = document.getElementById("ac");
      b.className = "buton mavi";
      b.textContent = "Hurma'yı aç";
    }
    // Adres cubugunda jeton birakma.
    if (location.hash && history.replaceState) {
      history.replaceState(null, "", location.pathname + location.search);
    }
  })();
</script>
</body>
</html>
